walkdir = "2"
rusqlite = "0.40.1"
strum = "0.28.0"
strum_macros = "0.28.0"
rayon = "1.12.0"
r2d2_sqlite = "0.35.0"
r2d2 = "0.8.10"
regex = "1.13.1"
blake3 = "1.8.5"
chacha20-poly1305 = "0.2.0"
base64 = "0.23.0"
toml = "1.1.4"
argon2 = "0.5.3"
rand = "0.10.2"
hex = "0.4"
mail-send = "0.6.1"
once_cell = "1.21.4"
