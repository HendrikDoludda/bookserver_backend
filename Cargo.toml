[package]
name = "bookserver_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
futures = "0.3.32"
tracing = "0.1"
tracing-subscriber = "0.3.23"
serde = { version = "1", features = ["derive"]}
serde_json = "1.0.150"
walkdir = "2"
rusqlite = "0.40.1"
strum = "0.28.0"
strum_macros = "0.28.0"
rayon = "1.12.0"
r2d2_sqlite = "0.35.0"
r2d2 = "0.8.10"
regex = "1.13.0"
blake3 = "1.8.5"
argon2 = "0.5.3"
rand = "0.10.2"
once_cell = "1.21.4"
anyhow = "1.0.103"
thiserror = "2.0.18"
natord = "1.0.9"
epub-parser = "0.3.4"
pdfium-render = "0.9.2"
image = "0.25.10"
zip = "8.6.0"
log = "0.4.33"
tower-http = {version = "0.7.0", features = ["full"]}
tower = "0.5.3"
uuid = {version="1.23.5", features=["v4",]}

