[package]
name = "bookserver_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
futures = "0.3.32"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"]}
serde_json = "1"
walkdir = "2"
rusqlite = "0.38.0"
strum = "0.28.0"
strum_macros = "0.28.0"
rayon = "1.11.0"
r2d2_sqlite = "0.32.0"
r2d2 = "0.8.10"
regex = "1.12.3"
blake3 = "1.8.3"
once_cell = "1.21.3"
anyhow = "1.0.102"
thiserror = "2.0.18"
natord = "1.0.9"
epub-parser = "0.3.4"
pdfium-render = "0.8.37"
image = "0.25.9"
zip = "8.1.0"
log = "0.4.29"
tower-http = {version = "0.6.8", features = ["full"]}
tower = "0.5.3"

