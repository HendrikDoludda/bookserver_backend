[package]
name = "bookserver_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"]}
serde_json = "1"
walkdir = "2"
rusqlite = "0.38.0"
strum = "0.27.2"
strum_macros = "0.27.2"
rayon = "1.11.0"