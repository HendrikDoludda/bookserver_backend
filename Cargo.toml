[package]
name = "bookserver_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"]}
serde_json = "1"
walkdir = "2"
rusqlite = "0.38.0"
strum = "0.27.2"
strum_macros = "0.27.2"
rayon = "1.11.0"
r2d2_sqlite = "0.32.0"
r2d2 = "0.8.10"
regex = "1.12.3"
blake3 = "1.8.3"
once_cell = "1.21.3"